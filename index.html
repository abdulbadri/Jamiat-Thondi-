function syncPaymentReceipts(p){db.receipts=db.receipts.filter(r=>r.paymentId!==p.id);let m=db.members.find(x=>x.id===p.memberId),name=m?.name||'',millath=Number(p.millathAmount||0),thondi=Number(p.thondiFundAmount||0);if(p.type==='Millath Fund'){if(millath>0){db.receipts.push({id:uid('r'),receipt:p.receipt,kind:'Payment',receiptType:'Millath Fund',paymentId:p.id,memberId:p.memberId,date:p.date,amount:millath,millathAmount:millath,subscriptionAmount:millath,thondiFundAmount:0,mode:p.mode,name,type:'Millath Fund'});}if(thondi>0){let tr=p.thondiReceipt||('JTF-'+new Date().getFullYear()+'-'+String(db.receipts.filter(x=>x.receiptType==='Thondi Fund').length+1).padStart(6,'0'));p.thondiReceipt=tr;db.receipts.push({id:uid('r'),receipt:tr,kind:'Payment',receiptType:'Thondi Fund',paymentId:p.id,memberId:p.memberId,date:p.date,amount:thondi,millathAmount:0,subscriptionAmount:0,thondiFundAmount:thondi,mode:p.mode,name,type:'Thondi Fund'});}}else{db.receipts.push({id:uid('r'),receipt:p.receipt,kind:'Payment',receiptType:p.type,paymentId:p.id,memberId:p.memberId,date:p.date,amount:p.amount,millathAmount:0,subscriptionAmount:0,thondiFundAmount:0,mode:p.mode,name,type:p.type});}}

function savePaymentEdit(id){let p=db.payments.find(x=>x.id===id);if(!p)return;let memberId=document.getElementById('ep_member').value,amount=Number(document.getElementById('ep_amount').value),type=document.getElementById('ep_type').value,date=document.getElementById('ep_date').value;if(!memberId||amount<=0||!date)return alert('Please enter valid payment details.');let oldType=p.type,oldDate=p.date,oldMember=p.memberId;p.memberId=memberId;p.amount=amount;p.type=type;p.date=date;p.mode=document.getElementById('ep_mode').value;p.ref=document.getElementById('ep_ref').value;p.note=document.getElementById('ep_note').value;let monthKey=date.slice(0,7);if(type==='Millath Fund'){let prior=db.payments.some(x=>x.id!==p.id&&x.memberId===memberId&&x.type==='Millath Fund'&&String(x.date||'').slice(0,7)===monthKey);p.millathAmount=!prior?Math.min(amount,100):0;p.subscriptionAmount=p.millathAmount;p.thondiFundAmount=amount-p.millathAmount;}else{p.millathAmount=0;p.subscriptionAmount=0;p.thondiFundAmount=0;}syncPaymentReceipts(p);save();closeModal();render('payments');}

mount>0){let tr='JTF-'+new Date().getFullYear()+'-'+String(db.receipts.filter(x=>x.receiptType==='Thondi Fund').length+1).padStart(6,'0');db.receipts.push({id:uid('r'),receipt:tr,kind:'Payment',receiptType:'Thondi Fund',paymentId:p.id,memberId,date,amount:thondiFundAmount,millathAmount:0,subscriptionAmount:0,thondiFundAmount,mode:p.mode,name:(db.members.find(m=>m.id===memberId)||{}).name||'',type:'Thondi Fund'});}}else{db.receipts.push({id:uid('r'),receipt:r,kind:'Payment',receiptType:type,paymentId:p.id,memberId,date,amount,millathAmount:0,subscriptionAmount:0,thondiFundAmount:0,mode:p.mode,name:(db.members.find(m=>m.id===memberId)||{}).name||'',type});}save();closeModal();render('payments');if(newMemberId){alert(type==='Millath Fund'?'Payment saved. This Millath Fund payer has been automatically added to the Members list. Separate Millath Fund and Thondi Fund receipt(s) generated.':'Payment saved. New person has been added to the Members list. Separate receipt(s) generated.');openMember(newMemberId)}else{alert('Payment saved. Separate receipt(s) generated for Millath Fund and Thondi Fund.')}}

function filterExpenses(){let q=(document.getElementById('expSearch').value||'').toLowerCase();let filtered=db.expenses.filter(x=>[x.fund,x.category,x.description,x.mode].filter(Boolean).join(' ').toLowerCase().includes(q));document.getElementById('expensesList').innerHTML=expenseTable(filtered.slice().reverse())}
function categoryFieldHtml(selected){let isKnown=EXPENSE_CATEGORIES.includes(selected);let selectVal=isKnown?selected:(selected?'Other':EXPENSE_CATEGORIES[0]);return `<select id="exp_category" onchange="toggleExpenseOtherCategory()">${EXPENSE_CATEGORIES.map(c=>`<option ${c===selectVal?'selected':''}>${c}</option>`).join('')}</select><input id="exp_category_other" placeholder="Category-ஐ இங்கு குறிப்பிடவும்" value="${!isKnown&&selected?esc(selected):''}" style="margin-top:8px;${selectVal==='Other'?'':'display:none'}">`}
function toggleExpenseOtherCategory(){let sel=document.getElementById('exp_category').value;let other=document.getElementById('exp_category_other');if(other)other.style.display=sel==='Other'?'':'none'}
function getExpenseCategoryValue(){let sel=document.getElementById('exp_category').value;if(sel==='Other'){return (document.getElementById('exp_category_other').value||'').trim()||'Other'}return sel}
function openExpense(){showModal(`<h3>Add Expense</h3><div class="formgrid"><div class="field"><label>Date *</label><input id="exp_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Fund Source *</label><select id="exp_fund">${EXPENSE_FUNDS.map(f=>`<option>${f}</option>`).join('')}</select></div><div class="field"><label>Category *</label>${categoryFieldHtml('')}</div><div class="field"><label>Amount *</label><input id="exp_amount" type="number" min="1" step="0.01"></div><div class="field"><label>Payment Mode *</label><select id="exp_mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option><option>Other</option></select></div><div class="field"><label>Reference No. *</label><input id="exp_ref"></div><div class="field" style="grid-column:1/-1"><label>Description *</label><input id="exp_desc" placeholder="e.g. Masjid electricity bill - September"></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveExpense()">Save Expense</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveExpense(){let date=document.getElementById('exp_date').value;let fund=document.getElementById('exp_fund').value;let category=getExpenseCategoryValue();let amount=Number(document.getElementById('exp_amount').value);let mode=document.getElementById('exp_mode').value;let ref=(document.getElementById('exp_ref').value||'').trim();let description=(document.getElementById('exp_desc').value||'').trim();if(!date)return alert('Date-ஐ நிரப்பவும்.');if(!fund)return alert('Fund Source-ஐ தேர்வு செய்யவும்.');if(!category)return alert('Category-ஐ நிரப்பவும்.');if(!amount||amount<=0)return alert('சரியான Amount-ஐ உள்ளிடவும்.');if(!mode)return alert('Payment Mode-ஐ தேர்வு செய்யவும்.');if(!ref)return alert('Reference No.-ஐ நிரப்பவும்.');if(!description)return alert('Description-ஐ நிரப்பவும்.');let x={id:uid('exp'),date,fund,category,amount,mode,ref,description};db.expenses.push(x);save();closeModal();render('expenses')}
function openExpenseEdit(id){let x=db.expenses.find(e=>e.id===id);if(!x)return;showModal(`<h3>Edit Expense</h3><div class="formgrid"><div class="field"><label>Date *</label><input id="exp_date" type="date" value="${esc(x.date)}"></div><div class="field"><label>Fund Source *</label><select id="exp_fund">${EXPENSE_FUNDS.map(f=>`<option ${f===x.fund?'selected':''}>${f}</option>`).join('')}</select></div><div class="field"><label>Category *</label>${categoryFieldHtml(x.category)}</div><div class="field"><label>Amount *</label><input id="exp_amount" type="number" min="1" step="0.01" value="${x.amount}"></div><div class="field"><label>Payment Mode *</label><select id="exp_mode"><option ${x.mode==='Cash'?'selected':''}>Cash</option><option ${x.mode==='UPI'?'selected':''}>UPI</option><option ${x.mode==='Bank Transfer'?'selected':''}>Bank Transfer</option><option ${x.mode==='Cheque'?'selected':''}>Cheque</option><option ${x.mode==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Reference No. *</label><input id="exp_ref" value="${esc(x.ref||'')}"></div><div class="field" style="grid-column:1/-1"><label>Description *</label><input id="exp_desc" value="${esc(x.description||'')}"></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveExpenseEdit('${id}')">Save Changes</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveExpenseEdit(id){let x=db.expenses.find(e=>e.id===id);if(!x)return;let date=document.getElementById('exp_date').value;let fund=document.getElementById('exp_fund').value;let category=getExpenseCategoryValue();let amount=Number(document.getElementById('exp_amount').value);let mode=document.getElementById('exp_mode').value;let ref=(document.getElementById('exp_ref').value||'').trim();let description=(document.getElementById('exp_desc').value||'').trim();if(!date)return alert('Date-ஐ நிரப்பவும்.');if(!fund)return alert('Fund Source-ஐ தேர்வு செய்யவும்.');if(!category)return alert('Category-ஐ நிரப்பவும்.');if(!amount||amount<=0)return alert('சரியான Amount-ஐ உள்ளிடவும்.');if(!mode)return alert('Payment Mode-ஐ தேர்வு செய்யவும்.');if(!ref)return alert('Reference No.-ஐ நிரப்பவும்.');if(!description)return alert('Description-ஐ நிரப்பவும்.');x.date=date;x.fund=fund;x.category=category;x.amount=amount;x.mode=mode;x.ref=ref;x.description=description;save();closeModal();render('expenses')}
function deleteExpense(id){if(!confirm('இந்த Expense-ஐ நீக்கவா?'))return;db.expenses=db.expenses.filter(x=>x.id!==id);save();render('expenses')}
function savePlan(id){let name=document.getElementById('pl_name').value.trim(),amount=Number(document.getElementById('pl_amount').value);if(!name||amount<=0)return alert('Plan name and a valid amount are required.');let obj={id:id||uid('pl'),name,amount,frequency:document.getElementById('pl_freq').value,status:document.getElementById('pl_status').value};let i=db.plans.findIndex(x=>x.id===id);if(i>=0)db.plans[i]=obj;else db.plans.push(obj);save();closeModal();render('subscriptions')}
function payments(el){let total=db.payments.reduce((a,p)=>a+Number(p.amount||0),0),types=['Millath Fund','Thondi Fund','Donation','Zakat','Sadaqah'];let sums=types.map(t=>[t,t==='Subscription'?db.payments.reduce((a,p)=>a+((p.type||'Millath Fund')==='Millath Fund'?Number(p.subscriptionAmount!=null?p.subscriptionAmount:Math.min(Number(p.amount||0),100)):0),0):t==='Thondi Fund'?db.payments.reduce((a,p)=>a+((p.type||'Millath Fund')==='Millath Fund'?Number(p.thondiFundAmount!=null?p.thondiFundAmount:Math.max(Number(p.amount||0)-100,0)):0),0):db.payments.filter(p=>(p.type||'Millath Fund')===t).reduce((a,p)=>a+Number(p.amount||0),0)]);el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Total Collected</div><div class="num">${money(total)}</div></div><div class="card"><div class="muted">Payment Count</div><div class="num">${db.payments.length}</div></div>${sums.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${money(x[1])}</div></div>`).join('')}</div><div class="panel"><div class="actions"><input id="paySearch" placeholder="Search by member name, mobile or receipt no." oninput="filterPayments()" style="padding:10px;border:1px solid #ccd3d8;border-radius:7px;flex:1"><button class="btn" onclick="openPayment()">+ Add Payment</button></div><div id="paymentsList">${paymentTable(db.payments.slice().reverse())}</div></div>`}
function filterPayments(){let q=(document.getElementById('paySearch').value||'').toLowerCase();let filtered=db.payments.filter(p=>{let m=db.members.find(x=>x.id===p.memberId);let hay=[p.receipt,m&&m.name,m&&m.mobile,m&&m.memberNo,p.type,p.mode].filter(Boolean).join(' ').toLowerCase();return hay.includes(q)});document.getElementById('paymentsList').innerHTML=paymentTable(filtered.slice().reverse())}
function printPaymentReceipt(paymentId){let r=db.receipts.find(x=>x.paymentId===paymentId);if(r)printReceipt(r.id)}
function donationReceiptNo(){let y=new Date().getFullYear();return 'JTD-'+y+'-'+String(db.donations.length+1).padStart(6,'0')}
function openDonation(){let opts='<option value="">General Donation</option>'+db.members.map(m=>`<option value="${m.id}">${esc(m.memberNo)} — ${esc(m.name)}</option>`).join('');showModal(`<h3>Add Donation</h3><div class="formgrid"><div class="field"><label>Donor</label><select id="don_member" onchange="fillDonorFromMember()">${opts}</select></div><div class="field"><label>Donor Name *</label><input id="don_name" placeholder="Name of donor"></div><div class="field"><label>Mobile / WhatsApp</label><input id="don_mobile" placeholder="10 digit mobile number"></div><div class="field"><label>Donation Amount *</label><input id="don_amount" type="number" min="1" step="0.01"></div><div class="field"><label>Donation Date</label><input id="don_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Donation Type</label><select id="don_type"><option>General Donation</option><option>Zakat</option><option>Sadaqah</option><option>Fitrah</option><option>Building Fund</option><option>Education Fund</option><option>Welfare Fund</option><option>Other</option></select></div><div class="field"><label>Payment Mode</label><select id="don_mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option><option>Online Payment</option><option>Other</option></select></div><div class="field"><label>Transaction / Reference No.</label><input id="don_ref"></div><div class="field"><label>Remarks</label><input id="don_note"></div></div><div class="actions" style="margin-top:18px"><button class="btn" onclick="saveDonation()">Save & Generate Receipt</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveDonation(){let memberId=document.getElementById('don_member').value,name=document.getElementById('don_name').value.trim(),amount=Number(document.getElementById('don_amount').value),mobile=document.getElementById('don_mobile').value.trim();if(!name||amount<=0)return alert('Donor name and valid amount are required.');if(mobile&&!isValidMobile(mobile))return alert('Mobile Number சரியான 10 இலக்கங்களா இருக்க வேண்டும் (அல்லது காலியா விடவும்).');let r=donationReceiptNo(),d={id:uid('d'),memberId,name,mobile,amount,date:document.getElementById('don_date').value,type:document.getElementById('don_type').value,mode:document.getElementById('don_mode').value,ref:document.getElementById('don_ref').value,note:document.getElementById('don_note').value,receipt:r,status:'Received'};db.donations.push(d);db.receipts.push({id:uid('r'),receipt:r,kind:'Donation',donationId:d.id,memberId,date:d.date,amount,mode:d.mode,name:d.name,mobile:d.mobile,type:d.type});save();closeModal();alert('Donation saved. Receipt: '+r);render('donations')}
function fillDonorFromMember(){let id=document.getElementById('don_member').value;let nameField=document.getElementById('don_name'),mobileField=document.getElementById('don_mobile');if(!id){return}let m=db.members.find(x=>x.id===id);if(m){nameField.value=m.name;mobileField.value=m.mobile||m.whatsapp||''}}
function donationDashboard(el){let now=new Date(),ym=now.toISOString().slice(0,7),year=String(now.getFullYear());let total=db.donations.reduce((a,d)=>a+Number(d.amount||0),0),month=db.donations.filter(d=>d.date&&d.date.slice(0,7)===ym).reduce((a,d)=>a+Number(d.amount||0),0),yr=db.donations.filter(d=>d.date&&d.date.slice(0,4)===year).reduce((a,d)=>a+Number(d.amount||0),0),count=db.donations.length;let types={};db.donations.forEach(d=>types[d.type]=(types[d.type]||0)+Number(d.amount||0));let monthly=Array.from({length:12},(_,i)=>{let m=String(i+1).padStart(2,'0');return {m,total:db.donations.filter(d=>d.date&&d.date.slice(0,7)===year+'-'+m).reduce((a,d)=>a+Number(d.amount||0),0)}});el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Total Donations</div><div class="num">${money(total)}</div></div><div class="card"><div class="muted">This Month</div><div class="num">${money(month)}</div></div><div class="card"><div class="muted">This Year</div><div class="num">${money(yr)}</div></div><div class="card"><div class="muted">Donation Count</div><div class="num">${count}</div></div></div><div class="panel"><div class="top"><h3>Donation Dashboard — ${year}</h3><button class="btn" onclick="openDonation()">+ Add Donation</button></div><h4>Monthly Donations</h4><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Amount</th></tr></thead><tbody>${monthly.map(x=>`<tr><td>${new Date(year+'-'+x.m+'-01').toLocaleString('en-IN',{month:'long'})}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Donation-wise / Category-wise Summary</h3><div class="table-wrap"><table class="table"><thead><tr><th>Donation Type</th><th>Total Amount</th></tr></thead><tbody>${Object.keys(types).length?Object.entries(types).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join(''):`<tr><td colspan="2" class="muted">No donations recorded yet.</td></tr>`}</tbody></table></div></div><div class="panel"><h3>Recent Donations</h3><div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Donor</th><th>Type</th><th>Date</th><th>Amount</th><th>Action</th></tr></thead><tbody>${db.donations.slice().reverse().slice(0,10).map(d=>`<tr><td>${esc(d.receipt)}</td><td><button class="btn secondary" onclick="openDonorHistory('${d.id}')">${esc(d.name)}</button></td><td>${esc(d.type)}</td><td>${esc(d.date)}</td><td>${money(d.amount)}</td><td><button class="btn" onclick="shareDonationWhatsApp('${d.id}')">WhatsApp</button></td></tr>`).join('')}</tbody></table></div></div>`}
function donations(el){let total=db.donations.reduce((a,d)=>a+d.amount,0);el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Total Donations</div><div class="num">${money(total)}</div></div><div class="card"><div class="muted">Donation Count</div><div class="num">${db.donations.length}</div></div></div><div class="panel"><div class="actions"><button class="btn" onclick="openDonation()">+ Add Donation</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Donor</th><th>Type</th><th>Date</th><th>Mode</th><th>Amount</th><th>Action</th></tr></thead><tbody>${db.donations.slice().reverse().map(d=>`<tr><td>${esc(d.receipt)}</td><td><button class="btn secondary" onclick="openDonorHistory('${d.id}')">${esc(d.name)}</button></td><td>${esc(d.type)}</td><td>${esc(d.date)}</td><td>${esc(d.mode)}</td><td>${money(d.amount)}</td><td><div class="row-actions"><button class="btn secondary" onclick="printDonationReceipt('${d.id}')">Print</button><button class="btn" onclick="shareDonationWhatsApp('${d.id}')">WhatsApp</button><button class="btn edit icon-only" onclick="openDonationEdit('${d.id}')" title="Edit" aria-label="Edit"><img src="${EDIT_ICON_DATA_URI}" style="width:15px;height:auto;vertical-align:middle"></button>${isAdminRole()?`<button class="btn danger icon-only" onclick="deleteDonation('${d.id}')" title="Delete" aria-label="Delete"><img src="${TRASH_ICON_DATA_URI}" style="width:15px;height:auto;vertical-align:middle"></button>`:''}</div></td></tr>`).join('')}</tbody></table></div></div>`}
function openDonorHistory(donationId){let d=db.donations.find(x=>x.id===donationId);if(!d)return;let list=db.donations.filter(x=>(d.mobile&&x.mobile===d.mobile)||(!d.mobile&&x.name.trim().toLowerCase()===d.name.trim().toLowerCase()));let total=list.reduce((a,x)=>a+Number(x.amount||0),0);showModal(`<h3>Donor History — ${esc(d.name)}</h3><p class="muted">${esc(d.mobile||'')}</p><div class="grid" style="grid-template-columns:repeat(2,1fr)"><div class="card"><div class="muted">Total Donated</div><div class="num">${money(total)}</div></div><div class="card"><div class="muted">Donation Count</div><div class="num">${list.length}</div></div></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Receipt</th><th>Type</th><th>Date</th><th>Amount</th></tr></thead><tbody>${list.slice().reverse().map(x=>`<tr><td>${esc(x.receipt)}</td><td>${esc(x.type)}</td><td>${esc(x.date)}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:16px"><button class="btn secondary" onclick="closeModal()">Close</button></div>`)}
function receiptPrintHtml(title,rows){let org=(db.settings&&db.settings.org)||'JAMIAT ULAMA-I-THONDI';let rowsHtml=rows.map(([label,value])=>{let isAmount=label==='Amount';return `<tr><td class="lbl">${esc(label)}</td><td class="val${isAmount?' amt':''}">${esc(value)}</td></tr>`}).join('');return `<!doctype html><html><head><title>${esc(org)} Receipt</title><style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#ffffff;padding:26px}

</style></head><body>
<div class="box">
<div class="head"><img class="logofull" src="${LOGO_DATA_URI}"><p>Jamaath Millath Fund &amp; Donation Management</p></div>
<div class="title">${esc(title)}</div>
<table>${rowsHtml}</table>
<div class="foot"><div class="note">Jazakallahu Khairan — May Allah reward you for your contribution.</div><div class="sign"><img src="${SIGNATURE_DATA_URI}"><div class="line"></div>Authorized Signature</div></div>
</div>
<button class="printbtn" onclick="window.print()">Print Receipt</button>
</body></html>`}
function printDonationReceipt(id){let d=db.donations.find(x=>x.id===id);if(!d)return;let rows=[['Receipt No.',d.receipt],['Donor Name',d.name],['Donation Type',d.type],['Date',d.date],['Payment Mode',d.mode],['Amount',money(d.amount)]];let w=window.open('','_blank');w.document.write(receiptPrintHtml('Donation Receipt',rows));w.document.close()}
function normalizeWhatsApp(phone){let p=String(phone||'').replace(/\D/g,'');if(p.length===10)p='91'+p;return p}
function pendingTable(arr){if(!arr.length)return '<p class="muted">அனைத்து Active Members-உம் இந்த மாதம் Millath Fund செலுத்திவிட்டனர். 🎉</p>';return `<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Jamaath</th><th>Action</th></tr></thead><tbody>${arr.map(m=>`<tr><td>${esc(m.memberNo)}</td><td>${esc(m.name)}</td><td>${esc(m.mobile)}</td><td>${esc(m.muhalla||'')}</td><td><button class="btn" onclick="sendPendingReminder('${m.id}')">WhatsApp Reminder</button></td></tr>`).join('')}</tbody></table></div>`}
function pending(el){let monthLabel=new Date().toLocaleString('en-IN',{month:'long',year:'numeric'});let pendingList=pendingMembersThisMonth();el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Pending This Month (${esc(monthLabel)})</div><div class="num">${pendingList.length}</div></div><div class="card"><div class="muted">Active Members</div><div class="num">${db.members.filter(m=>m.status==='Active').length}</div></div></div><div class="panel"><div class="actions"><input id="pendingSearch" placeholder="Search by name or mobile" oninput="filterPending()" style="padding:10px;border:1px solid #ccd3d8;border-radius:7px;flex:1"></div><div id="pendingList">${pendingTable(pendingList)}</div></div>`}
function filterPending(){let q=(document.getElementById('pendingSearch').value||'').toLowerCase();let filtered=pendingMembersThisMonth().filter(m=>[m.name,m.mobile,m.memberNo].filter(Boolean).join(' ').toLowerCase().includes(q));document.getElementById('pendingList').innerHTML=pendingTable(filtered)}
function sendPendingReminder(memberId){let m=db.members.find(x=>x.id===memberId);if(!m)return;let org=(db.settings&&db.settings.org)||'JAMIAT ULAMA-I-THONDI';let monthLabel=new Date().toLocaleString('en-IN',{month:'long',year:'numeric'});let phone=normalizeWhatsApp(m.whatsapp||m.mobile);let text=`Assalamu Alaikum ${m.name},\n\nThis is a gentle reminder from ${org} that your Millath Fund contribution for ${monthLabel} is still pending. Your Member ID: ${m.memberNo}.\n\nKindly settle it at your earliest convenience. Jazakallahu Khairan.\n\n${org}`;window.open(phone?`https://wa.me/${phone}?text=${encodeURIComponent(text)}`:`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank')}
function drawStar(ctx,cx,cy,outerR,points,innerRatio,color){let innerR=outerR*innerRatio;ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<points*2;i++){let rad=i%2===0?outerR:innerR;let angle=Math.PI/points*i-Math.PI/2;let x=cx+Math.cos(angle)*rad,y=cy+Math.sin(angle)*rad;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fill()}
function drawEmblem(ctx,cx,cy,r){ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000000';ctx.beginPath();ctx.arc(cx-r*0.3,cy,r*0.8,0,Math.PI*2);ctx.fill();drawStar(ctx,cx+r*0.45,cy,r*0.24,5,0.5,'#ffffff')}
let logoImgCache=null;

let sigImgCache=null;

async function drawReceiptCanvas(title,rows,orgName){let width=680,headerH=175,rowH=48,topPad=38,footerH=110;let height=headerH+topPad+rows.length*rowH+footerH;let canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;let ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,width,height);ctx.strokeStyle='#000000';ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,width-3,height-3);ctx.fillStyle='#000000';ctx.fillRect(0,0,width,headerH);let logo=await loadLogoImage();if(logo){let lw=Math.min(340,width*0.5),lh=lw*(logo.height/logo.width);ctx.drawImage(logo,(width-lw)/2,16,lw,lh);ctx.textAlign='center';ctx.fillStyle='#cccccc';ctx.font='12px Arial';ctx.fillText('Jamaath Millath Fund & Donation Management',width/2,16+lh+20)}else{drawEmblem(ctx,width/2,headerH/2-10,32);ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 22px Arial';ctx.fillText(orgName,width/2,headerH/2+38)}ctx.textAlign='center';ctx.fillStyle='#000000';ctx.font='bold 16px Arial';ctx.fillText(title.toUpperCase(),width/2,headerH+30);ctx.strokeStyle='#000000';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,headerH+42);ctx.lineTo(width-40,headerH+42);ctx.stroke();let y=headerH+topPad+22;ctx.textAlign='left';rows.forEach(([label,value],i)=>{if(i%2===0){ctx.fillStyle='#f2f2f2';ctx.fillRect(40,y-30,width-80,rowH)}let isAmount=label==='Amount';ctx.font='14px Arial';ctx.fillStyle='#333333';ctx.fillText(label,58,y-4);ctx.font=isAmount?'bold 22px Arial':'16px Arial';ctx.fillStyle='#000000';ctx.textAlign='right';ctx.fillText(String(value),width-58,y-2);ctx.textAlign='left';y+=rowH});ctx.strokeStyle='#000000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(40,y+8);ctx.lineTo(width-40,y+8);ctx.stroke();ctx.fillStyle='#333333';ctx.font='italic 13px Arial';ctx.textAlign='left';ctx.fillText('Jazakallahu Khairan — May Allah reward you.',50,y+40);let sig=await loadSignatureImage();if(sig){let sw=110,sh=sw*(sig.height/sig.width);ctx.drawImage(sig,width-50-sw,y+8,sw,sh)}ctx.textAlign='right';ctx.strokeStyle='#000000';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(width-190,y+34);ctx.lineTo(width-50,y+34);ctx.stroke();ctx.fillStyle='#333333';ctx.font='12px Arial';ctx.fillText('Authorized Signature',width-50,y+52);return canvas}
function canvasToFile(canvas,filename){return new Promise(resolve=>{canvas.toBlob(blob=>resolve(new File([blob],filename,{type:'image/png'})),'image/png')})}
async function shareImageOrDownload(file,waText,phone){if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Receipt',text:waText});return}catch(e){}}let url=URL.createObjectURL(file);let a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);alert('Receipt image downloaded (image-sharing is not supported on this browser). Please attach the downloaded image manually in the WhatsApp chat that opens next.');window.open(phone?`https://wa.me/${phone}?text=${encodeURIComponent(waText)}`:`https://wa.me/?text=${encodeURIComponent(waText)}`,'_blank')}
async function shareReceiptWhatsApp(receiptId){let r=db.receipts.find(x=>x.id===receiptId);if(!r)return;let org=(db.settings&&db.settings.org)||'JAMIAT ULAMA-I-THONDI';let phone='',text='',rows=[],title='';if(r.kind==='Donation'){let d=db.donations.find(x=>x.id===r.donationId);if(!d)return;phone=normalizeWhatsApp(d.mobile);title='Donation Receipt';rows=[['Receipt No.',d.receipt],['Donor Name',d.name],['Donation Type',d.type],['Date',d.date],['Payment Mode',d.mode],['Amount',money(d.amount)]];text=`Assalamu Alaikum ${d.name},\n\n${org} — Donation Receipt\nReceipt No: ${d.receipt}\nDonor: ${d.name}\nDonation Type: ${d.type}\nAmount: ${money(d.amount)}\nDate: ${d.date}\nPayment Mode: ${d.mode}${d.ref?'\nReference No: '+d.ref:''}\n\nJazakallahu Khairan for your generous contribution.\n\n${org}`;}else{let p=db.payments.find(x=>x.id===r.paymentId),m=db.members.find(x=>x.id===r.memberId);if(!p||!m)return;phone=normalizeWhatsApp(m.whatsapp||m.mobile);let rt=r.receiptType||((r.type||'Millath Fund')==='Thondi Fund'?'Thondi Fund':'Millath Fund');title=rt+' Receipt';rows=[['Receipt No.',r.receipt],['Member ID',m.memberNo],['Member Name',m.name],['Fund Type',rt],['Date',r.date],['Payment Mode',r.mode],['Amount',money(r.amount)]];text=`Assalamu Alaikum ${m.name},\n\n${org} — ${rt} Receipt\nReceipt No: ${r.receipt}\nMember ID: ${m.memberNo}\nName: ${m.name}\nFund Type: ${rt}\nAmount: ${money(r.amount)}\nDate: ${r.date}\nPayment Mode: ${r.mode}${p.ref?'\nReference No: '+p.ref:''}\n\nJazakallahu Khairan.\n\n${org}`;}let canvas=await drawReceiptCanvas(title,rows,org);let file=await canvasToFile(canvas,(r.receipt||'receipt')+'.png');await shareImageOrDownload(file,text,phone)}
function shareDonationWhatsApp(id){let r=db.receipts.find(x=>x.kind==='Donation'&&x.donationId===id);if(r)shareReceiptWhatsApp(r.id)}

)}</div></div><div class="card"><div class="muted">Net Balance</div><div class="num">${money(payTotal-expenseTotal)}</div></div><div class="card"><div class="muted">Millath Fund Total</div><div class="num">${money(fundTotals['Millath Fund'])}</div></div><div class="card"><div class="muted">Thondi Fund Total</div><div class="num">${money(fundTotals['Thondi Fund'])}</div></div><div class="card"><div class="muted">Donations Total</div><div class="num">${money(fundTotals['Donation'])}</div></div><div class="card"><div class="muted">Zakat Total</div><div class="num">${money(fundTotals['Zakat'])}</div></div><div class="card"><div class="muted">Sadaqah Total</div><div class="num">${money(fundTotals['Sadaqah'])}</div></div></div><div class="panel"><h3>Fund Balance (Income − Expense)</h3><div class="table-wrap"><table class="table"><thead><tr><th>Fund</th><th>Income</th><th>Expense</th><th>Balance</th></tr></thead><tbody>${balanceRows.map(r=>`<tr><td>${esc(r.fund)}</td><td>${money(r.income)}</td><td>${money(r.expense)}</td><td><b>${money(r.balance)}</b></td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${money(payTotal)}</b></td><td><b>${money(expenseTotal)}</b></td><td><b>${money(payTotal-expenseTotal)}</b></td></tr></tbody></table></div></div><div class="panel"><h3>Monthly Summary — ${year}</h3><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Millath Fund</th><th>Thondi Fund</th><th>Donations</th><th>Zakat</th><th>Sadaqah</th><th>Expense</th></tr></thead><tbody>${monthly.map(m=>`<tr><td>${m.label}</td><td>${money(m['Millath Fund'])}</td><td>${money(m['Thondi Fund'])}</td><td>${money(m['Donation'])}</td><td>${money(m['Zakat'])}</td><td>${money(m['Sadaqah'])}</td><td>${money(m['Expense'])}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Fund PDF Downloads (Month Wise)</h3><p class="muted">ஒரு மாதத்தைத் தேர்வு செய்து அந்த மாத Fund list-ஐ தனித்தனி PDF ஆக பதிவிறக்கம் செய்யலாம்.</p><div class="formgrid" style="max-width:520px;m  for(let m=0;m<12;m++){

  let monthIncome=db.payments.filter(p=>p.date&&p.date.slice(0,7)===ymKey).reduce((a,p)=>a+Number(p.amount||0),0)+db.donations.filter(d=>d.date&&d.date.slice(0,7)===ymKey).reduce((a,d)=>a+Number(d.amount||0),0);
  let monthExpense=db.expenses.filter(x=>x.date&&x.date.slice(0,7)===ymKey).reduce((a,x)=>a+Number(x.amount||0),0);
  let label=new Date(year,m,1).toLocaleString('en-IN',{month:'long'});
  if(y>H-20){doc.addPage();y=16}
  doc.text(label,14,y);doc.text(moneyPdf(monthIncome),95,y,{align:'right'});doc.text(moneyPdf(monthExpense),135,y,{align:'right'});doc.text(moneyPdf(monthIncome-monthExpense),180,y,{align:'right'});
  y+=6;
 }
 y+=16;
 if(y>H-40){doc.addPage();y=24}
 doc.setFontSize(9);doc.setFont(undefined,'normal');
 doc.text('_____________________',20,y);doc.text('_____________________',85,y);doc.text('_____________________',150,y);
 y+=5;
 doc.text('Treasurer',20,y);doc.text('Secretary',85,y);doc.text('President',150,y);
 doc.save('Annual-Financial-Statement-'+year+'.pdf');
}
function setDefaultFundReportMonth(){const el=document.getElementById('fundReportMonth');if(el&&!el.value){const d=new Date();el.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}}

</script>
